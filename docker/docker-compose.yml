services:
  web:
    image: "${DS_IMAGE:-ghcr.io/zdabing/m3u8-dl:latest}"
    pull_policy: missing
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '6600:6600'
    volumes:
      - ./downloads:/app/downloads
      - ./cache:/app/cache
    environment:
      DS_SECRET: "${DS_SECRET:-}" # 猫抓接收需要设置访问密码
    restart: unless-stopped
