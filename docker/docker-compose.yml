services:
  web:
    image: "${DS_IMAGE:-ghcr.io/zdabing/m3u8-dl:latest}"
    pull_policy: missing
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - '6600:6600'
    volumes:
      - ./downloads:/app/downloads
      - ./cache:/app/cache
    environment:
      DS_SECRET: "${DS_SECRET:-}" # 猫抓接收需要设置访问密码
      DS_RSS_BRIDGE_ENABLED: "${DS_RSS_BRIDGE_ENABLED:-false}" # 设为 true 默认启用内置 RSS 中转，也可在页面设置中随时开关
    restart: unless-stopped
